name: "Reservation Happy Path"
description: "Full 3-turn reservation flow: guest provides date, time, and party size, then the bot confirms."
timeout_ms: 90000
steps:
  - role: "user"
    message: "Hi, I'd like to make a reservation"
    assert:
      - type: "intent"
        value: "Ask for the reservation details such as date, time, or party size"

  - role: "user"
    message: "This saturday at 7pm for 2 people"
    delay_ms: 1500
    assert:
      - type: "intent"
        value: "Confirm the reservation for this Saturday at 7pm for 2 people"
      - type: "contains_any"
        values: ["saturday", "7pm", "7 pm", "7:00"]

  - role: "user"
    message: "Appreciate it!"
    delay_ms: 1000
    assert:
      - type: "react"
        values: ["love", "like"]